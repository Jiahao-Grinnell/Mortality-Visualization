var numOpts = new Array(12, 4, 1);
var blueOpts = new Array("blue_Cause_of_Death", "blue_Sex", "blue_Race");
var redOpts = new Array("red_Cause_of_Death", "red_Sex", "red_Race");

      function getRadio(id) {
      var radios = document.getElementsByName(id);

      for (var i = 0; i < radios.length; i++) {       
	 if (radios[i].checked) {
		return radios[i].value;
		break;
         }
      }
      }	

      var red = this.legend.lines[0];
      var blue = this.legend.lines[numOpts[0]];

      function disableOthers(){

      // these must happen first or else we try ( and probably fail ) to make a no line graph
      this.red.series.enable();
      this.red.element.classList.remove('disabled');

      for (var i = 1; i < this.legend.lines.length; i++) {
      
      legend.lines[i].series.disable();
      legend.lines[i].element.classList.add('disabled');
      }
      this.blue.series.enable();
      this.blue.element.classList.remove('disabled');
      
      };
      
      function blueFunc()
      {
      var val = 0;
      for (var i = 0; i < numOpts.length; i++) {
	val = val + numOpts[i]*getRadio(blueOpts[i]);
      }
      if(blue != red) {
      this.blue.series.disable();
      this.blue.element.classList.add('disabled');
      }

      this.blue = legend.lines[val];
      this.blue.series.enable();
      this.blue.element.classList.remove('disabled');
      }

      function redFunc()
      {
      var val = 0;
      for (var i = 0; i < numOpts.length; i++) {
	val = val + numOpts[i]*getRadio(redOpts[i]);
      }
      if(blue != red) {
      this.red.series.disable();
      this.red.element.classList.add('disabled');
      }

      this.red = legend.lines[val];
      this.red.series.enable();
      this.red.element.classList.remove('disabled');
      }
      
      var init = this.disableOthers();
